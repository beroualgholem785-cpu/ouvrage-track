name: Construire l'APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Choisir la dernière version de l'application
        run: |
          f=$(ls www/app_v*.html 2>/dev/null | sort -V | tail -1)
          if [ -n "$f" ]; then cp "$f" www/index.html; echo "Version utilisée : $f"; fi
          rm -f www/app_v*.html
          find www -maxdepth 1 -name 'index (*).html' -delete
          grep -o "__ANDROID_APP = [0-9]*" www/index.html || true
      - run: npm install
      - run: npx cap add android
      - name: Icône de l'application
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image
          src = Image.open('www/icons/icon-512.png').convert('RGBA')
          R = 'android/app/src/main/res/'
          for n, s, f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              img = src.resize((s, s), Image.LANCZOS)
              img.save(R + 'mipmap-' + n + '/ic_launcher.png')
              img.save(R + 'mipmap-' + n + '/ic_launcher_round.png')
              i = f 
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              fg.paste(src.resize((i, i), Image.LANCZOS), ((f - i) // 2, (f - i) // 2))
              fg.save(R + 'mipmap-' + n + '/ic_launcher_foreground.png')
          open(R + 'values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>')
          EOF
      - run: npx cap sync android
      - name: Signer avec une clé stable (pour que les mises à jour s'installent sans erreur)
        run: |
          cp ci/ouvragetrack-debug.keystore android/app/debug.keystore
          python3 - <<'EOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          block = '''    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'ouvrageTrack2026'
                  keyAlias 'ouvragetrack'
                  keyPassword 'ouvrageTrack2026'
              }
          }
          '''
          s = s.replace('android {\n', 'android {\n' + block, 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          grep -A2 "signingConfigs" android/app/build.gradle
      - name: Compiler
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OuvrageTrack-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier les liens de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OuvrageTrack.apk
          files="OuvrageTrack.apk"
          z=$(ls windows/*.zip OuvrageTrack_Windows*.zip 2>/dev/null | sort -V | tail -1)
          if [ -n "$z" ]; then cp "$z" OuvrageTrack_Windows.zip; files="$files OuvrageTrack_Windows.zip"; echo "Zip Windows : $z"; fi
          gh release delete telechargement --yes --cleanup-tag || true
          gh release create telechargement $files --target "${{ github.sha }}" --latest --title "Ouvrage Track - téléchargement" --notes "Fichiers à télécharger par les utilisateurs."

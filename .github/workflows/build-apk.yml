name: Construire l'APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Icône de l'application
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image
          src = Image.open('www/icons/icon-512.png').convert('RGBA')
          R = 'android/app/src/main/res/'
          for n, s, f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              img = src.resize((s, s), Image.LANCZOS)
              img.save(R + 'mipmap-' + n + '/ic_launcher.png')
              img.save(R + 'mipmap-' + n + '/ic_launcher_round.png')
              i = f * 60 // 100
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              fg.paste(src.resize((i, i), Image.LANCZOS), ((f - i) // 2, (f - i) // 2))
              fg.save(R + 'mipmap-' + n + '/ic_launcher_foreground.png')
          open(R + 'values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>')
          EOF
      - run: npx cap sync android
      - name: Compiler
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OuvrageTrack-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
